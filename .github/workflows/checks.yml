name: checks

# Two things happen here.
#
# The checks catch hand-maintained seams that rot silently: the reference doc
# vs components.css, the two skill copies, docs asset paths, native controls,
# the type scale.
#
# The regeneration keeps the *derived* files current — skill-source/ (the org
# bundle) and skill-manifest.json (what the deployed skill fetches). They are
# regenerated by the pre-commit hook (tools/regenerate.sh); here we regenerate
# again and refuse a pull request whose committed copies differ, printing the
# exact command to fix it. main is protected, so a stale manifest cannot land.
#
# Opt-in: with a REGEN_TOKEN repository secret (a fine-grained PAT with
# Contents: read/write on this repo) the workflow commits the regeneration to
# the pull-request branch itself instead of failing. A push made with the
# default GITHUB_TOKEN would not do: GitHub holds the pull_request run of a
# bot-authored commit for manual approval and the required check never turns
# green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # a pull request checks out its own branch, not the merge ref, so a
          # regeneration can be committed back to it (REGEN_TOKEN opt-in)
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ secrets.REGEN_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # A component in components.css that design-system-reference.md never
      # mentions is unusable: rule 1 of the skill only allows what the reference
      # lists, so the skill reports it as non-existent.
      - name: components.css vs the reference
        run: ./tools/check-reference-drift.py

      # SKILL.md and reference-prototypes/ exist twice here and sync-skill.sh
      # deliberately does not copy them, so nothing else keeps the two in step.
      - name: both skill copies carry the same content
        run: ./tools/check-skill-consistency.py

      # A path inside a CSS file resolves next to that file, not next to the page
      # including it. When one breaks the page still loads, it just renders without
      # tokens — so nothing catches it except looking.
      - name: docs pages and stylesheets resolve
        run: ./tools/check-docs-assets.py

      # A native <input type="date"> (and friends) renders the browser's own widget:
      # wrong typography, wrong colours, no tokens, different per OS. Nothing errors,
      # so it only ever surfaces when someone spots it in a screenshot.
      - name: no native controls the DS already covers
        run: ./tools/check-native-controls.py

      # 15px next to 14px is invisible in a diff and wrong on screen. The scale is
      # 12/14/16/20/26/32/42; anything else is a size someone eyeballed.
      - name: font sizes are on the type scale
        run: ./tools/check-font-scale.py

      # skill-source/ and skill-manifest.json are generated from the sources above.
      # Regenerate them here; the next two steps decide what to do with the result.
      - name: regenerate derived files (skill-source/, skill-manifest.json)
        run: ./tools/regenerate.sh

      - name: commit the regeneration to the pull request (needs the REGEN_TOKEN secret)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HAVE_TOKEN: ${{ secrets.REGEN_TOKEN != '' }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "$(git status --porcelain -- skill-manifest.json skill-source)" ]; then
            echo "✓ derived files were already current"; exit 0
          fi
          if [ "$HAVE_TOKEN" != "true" ]; then
            echo "derived files are stale and no REGEN_TOKEN secret is set — the next step reports the fix"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A skill-manifest.json skill-source
          git commit -q -m "Regenerate skill-source and skill-manifest.json" \
                        -m "Automated by .github/workflows/checks.yml via tools/regenerate.sh."
          git push origin "HEAD:$BRANCH"
          echo "::notice title=derived files regenerated::Committed to $BRANCH; the run for that commit is the one that counts."

      - name: derived files are current
        run: |
          if [ -n "$(git status --porcelain -- skill-manifest.json skill-source)" ]; then
            echo "Stale derived files:"
            git status --short -- skill-manifest.json skill-source
            echo
            git --no-pager diff --stat -- skill-manifest.json skill-source
            echo "::error title=derived files are stale::skill-source/ or skill-manifest.json does not match the sources. Fix: run  tools/regenerate.sh  and commit the result (or enable the hooks once: git config core.hooksPath .githooks)."
            exit 1
          fi
          echo "✓ derived files current"
