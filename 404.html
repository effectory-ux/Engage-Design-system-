<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Engage Design System</title>
  <script>
    /* Documentation pages moved from / to /docs/ . Anything that still points at the
       old URL (bookmarks, Figma links, the prototype gallery) lands here — forward it
       instead of showing a 404. Only rewrites paths we know moved; everything else
       falls through to the notice below. */
    (function () {
      var p = location.pathname;
      var m = p.match(/^(.*)\/((?:[a-z0-9-]+-docs|index|changelog|nav)\.html)$/);
      if (m && m[1].indexOf('/docs') === -1) {
        location.replace(m[1] + '/docs/' + m[2] + location.search + location.hash);
      }
    })();
  </script>
</head>
<body>
  <p>That page has moved. Try <a href="/Engage-Design-system-/docs/">the design system documentation</a>.</p>
</body>
</html>
